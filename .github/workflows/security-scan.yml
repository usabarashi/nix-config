name: "Security Scan"

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      matrix:
        config_name: [mac14-9, mac14-10]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install Nix
      uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
      with:
        extra_nix_config: |
          connect-timeout = 60
          stalled-download-timeout = 90

    - name: Wait for Nix daemon
      run: |
        for i in $(seq 1 30); do
          nix store ping 2>/dev/null && exit 0
          sleep 1
        done
        echo "::error::Nix daemon did not become ready within 30 seconds"
        exit 1

    - name: Build darwinConfigurations.${{ matrix.config_name }}.system
      run: |
        export CURRENT_USER=$(whoami)
        export REPOSITORY_PATH=$(pwd)
        # Synthetic serial for CI builds; these configurations are never
        # activated (the real serial is read on the target machine).
        export SERIAL_NUMBER=CI
        nix build .#darwinConfigurations.${{ matrix.config_name }}.system --impure

    - name: Generate SBOM
      run: |
        nix run nixpkgs#sbomnix -- ./result \
          --cdx sbom.cdx.json \
          --spdx sbom.spdx.json \
          --csv sbom.csv

    - name: Grype scan
      id: grype
      run: |
        nix run nixpkgs#grype -- sbom:sbom.cdx.json \
          -o table=grype-report.txt \
          -o sarif=grype-results.sarif
        vuln_count=$(nix run nixpkgs#jq -- '[.runs[].results[]] | length' grype-results.sarif)
        echo "vuln_count=${vuln_count}" >> "$GITHUB_OUTPUT"

    - name: Fix SARIF locations for Code Scanning
      run: |
        nix run nixpkgs#jq -- '
          (.runs[]?.results[]?) |= (
            ((.locations // []) | if length == 0 then [{}] else . end) as $locs |
            .locations = [$locs[] |
              if (.physicalLocation.artifactLocation.uri // "") != "" then .
              else
                ( .physicalLocation |= (. // {})
                | .physicalLocation.artifactLocation.uri |= (if . == "" or . == null then "flake.lock" else . end)
                | .physicalLocation.region |= (. // {})
                | .physicalLocation.region.startLine |= (. // 1)
                )
              end
            ]
          )
        ' grype-results.sarif > grype-results-fixed.sarif
        mv grype-results-fixed.sarif grype-results.sarif

    - name: Add scan summary
      run: |
        if [ "${{ steps.grype.outputs.vuln_count }}" = "0" ]; then
          echo "## Grype: no CVEs detected" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## Grype: ${{ steps.grype.outputs.vuln_count }} CVEs detected" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          cat grype-report.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload SARIF to Code Scanning
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
      with:
        sarif_file: grype-results.sarif
        category: ${{ matrix.config_name }}

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: security-scan-${{ matrix.config_name }}-${{ github.sha }}
        path: |
          sbom.cdx.json
          sbom.spdx.json
          sbom.csv
          grype-results.sarif
          grype-report.txt
        if-no-files-found: warn
        retention-days: 90

    # vulnxscan re-scans the same build output with vulnix, Grype and OSV and
    # reports how many scanners agree on each finding (`sum` column).
    # --triage adds Repology version info; --nixprs adds GitHub searches for
    # nixpkgs PRs that mention each CVE. vulnxscan queries unauthenticated, so
    # the PR search is capped at roughly 10 requests/minute and is the slowest
    # part of the run.
    #
    # This step is deliberately last: it is informational only and must never
    # delay the Grype SARIF upload or the SBOM artifacts above. timeout-minutes
    # bounds it, and its own report is uploaded separately below.
    #
    # How to triage a finding (is the fix already on our nixpkgs branch?):
    #   1. Open https://tracker.security.nixos.org and search the CVE id to see
    #      the affected nixpkgs package and whether a fix is tracked.
    #   2. PR numbers are listed in the nixpkgs_pr column of vulns.triage.csv.
    #      That search matches any PR mentioning the CVE, so confirm first that
    #      the PR is the one that actually fixes the package in question.
    #   3. Check that PR on https://nixpk.gs/pr-tracker.html to see whether it has
    #      reached nixpkgs-unstable, the branch our `nixpkgs` input tracks.
    #   4. If it has: `nix flake update nixpkgs`. If not: wait, or record the
    #      decision (false positive, not applicable, waiting on fix) in a
    #      vulnxscan whitelist. `vuln_id` and `comment` are mandatory columns.
    #      CI does not pass a whitelist, so re-run the scan locally with
    #      `--whitelist` to apply it. See README "Vulnerability triage".
    - name: vulnxscan (vulnix + Grype + OSV)
      id: vulnxscan
      continue-on-error: true
      timeout-minutes: 40
      run: |
        nix shell --inputs-from . nixpkgs#sbomnix -c \
          vulnxscan ./result --triage --nixprs

    - name: vulnxscan summary
      if: always()
      env:
        VULNXSCAN_OUTCOME: ${{ steps.vulnxscan.outcome }}
      run: |
        {
          echo "## vulnxscan (vulnix + Grype + OSV)"
          if [ "${VULNXSCAN_OUTCOME}" != "success" ]; then
            echo "Status: ${VULNXSCAN_OUTCOME} (informational only; see the step log)"
          fi
          if [ -f vulns.triage.csv ]; then
            echo "Findings: $(($(wc -l < vulns.triage.csv) - 1)) (see the vulnxscan artifact)"
          elif [ -f vulns.csv ]; then
            echo "Findings: $(($(wc -l < vulns.csv) - 1)) (see the vulnxscan artifact)"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload vulnxscan report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vulnxscan-${{ matrix.config_name }}-${{ github.sha }}
        path: |
          vulns.csv
          vulns.triage.csv
        if-no-files-found: ignore
        retention-days: 90
