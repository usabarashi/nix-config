name: "Flake Checker"

# Weekly health check of flake.lock (Determinate Systems flake-checker).
# - check-supported: the root nixpkgs input must track a supported branch
#   (e.g. nixpkgs-unstable, nixos-YY.MM, nixpkgs-YY.MM-darwin).
# - check-outdated: the root nixpkgs input must be less than 30 days old.
# - check-owner: the root nixpkgs input must come from the NixOS GitHub org.
#
# Only `nixpkgs` is checked. `nixpkgs-libffi-fix` is deliberately pinned to
# nixos-24.11 (see flake.nix) and would always fail check-supported/outdated.

on:
  push:
    branches: [ "main" ]
    paths:
      - "flake.lock"
      - ".github/workflows/flake-checker.yml"
  pull_request:
    paths:
      - "flake.lock"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-checker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Check flake.lock
      uses: DeterminateSystems/flake-checker-action@078f5f7f47ee188aa6cb472527ca5984e195222d # v9
      with:
        flake-lock-path: flake.lock
        nixpkgs-keys: nixpkgs
        check-supported: true
        check-outdated: true
        check-owner: true
        fail-mode: true
        send-statistics: false
