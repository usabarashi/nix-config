[cli]
auto_update = false

[features]
telemetry = false

[mcp_servers.voicevox]
command = "voicevox-mcp-server"
args = []
tool_timeout_sec = 120

[mcp_servers.library]
url = "https://library.usabarashi.net/mcp"
tool_timeout_sec = 120

[mcp_servers.library.headers]
Authorization = "Bearer ${LIBRARY_API_KEY}"

[mcp_servers.chrome-devtools]
command = "chrome-devtools-mcp"
args = [
    "--isolated",
    "--headless",
    "--channel=stable",
    "--no-usage-statistics",
    "--no-performance-crux",
]
startup_timeout_sec = 30
tool_timeout_sec = 120

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
yolo = false
compact_mode = false
permission_mode = "always-approve"
